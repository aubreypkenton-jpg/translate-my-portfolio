name: CI

# Runs on every push to any branch and on every pull request.
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - name: Ruff (lint)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage (fails under 85%)
        run: pytest

  docker:
    # proves the image the hosts deploy actually builds and boots
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tmp .
      - name: Boot and hit /health
        run: |
          docker run -d -p 8080:8080 --name app tmp
          for i in $(seq 1 20); do
            if curl -fsS localhost:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
